openapi: 3.0.3

info:
  title: Fracta API
  version: 1.0.0
  description: API educacional com IA para gestão de alunos, exercícios e turmas

servers:
  - url: https://backend-tcc-ten.vercel.app
    description: Produção

tags:
  - name: Autenticação
  - name: Usuários
  - name: Exercícios
  - name: Tentativas
  - name: Turmas
  - name: Alunos
  - name: IA

paths:

  /:
    get:
      tags: [Alunos]
      summary: Status da API
      responses:
        "200":
          description: API ativa

  /login:
    post:
      tags: [Autenticação]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token gerado

  /usuarios:
    get:
      tags: [Usuários]
      summary: Listar usuários
      responses:
        "200":
          description: Lista de usuários

    post:
      tags: [Usuários]
      summary: Criar usuário
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCreate"
      responses:
        "201":
          description: Usuário criado

  /usuarios/{id}:
    delete:
      tags: [Usuários]
      summary: Remover usuário
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removido

  /exercicios:
    get:
      tags: [Exercícios]
      summary: Listar exercícios
      responses:
        "200":
          description: Lista

    post:
      tags: [Exercícios]
      summary: Criar exercício
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExercicioCreate"
      responses:
        "201":
          description: Criado

  /tentativas:
    post:
      tags: [Tentativas]
      summary: Registrar tentativa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TentativaCreate"
      responses:
        "201":
          description: Registrado

  /tentativas/{id_aluno}:
    get:
      tags: [Tentativas]
      summary: Listar tentativas do aluno
      parameters:
        - name: id_aluno
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lista

  /turmas:
    get:
      tags: [Turmas]
      summary: Listar turmas
      responses:
        "200":
          description: Lista

    post:
      tags: [Turmas]
      summary: Criar turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TurmaCreate"
      responses:
        "201":
          description: Criado

  /entrar-turma:
    post:
      tags: [Turmas]
      summary: Entrar na turma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntrarTurma"
      responses:
        "200":
          description: OK

  /dashboard/{id_aluno}:
    get:
      tags: [Alunos]
      summary: Dashboard aluno
      parameters:
        - name: id_aluno
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK

  /analise-aluno/{id_aluno}:
    get:
      tags: [IA]
      summary: Análise IA aluno
      responses:
        "200":
          description: OK

  /devolutiva-ia/{id_aluno}:
    get:
      tags: [IA]
      summary: Feedback IA aluno
      responses:
        "200":
          description: OK

  /devolutiva-professor/{id_aluno}:
    get:
      tags: [IA]
      summary: Relatório professor
      responses:
        "200":
          description: OK

  /devolutiva-turma/{id_turma}:
    get:
      tags: [IA]
      summary: Relatório turma
      responses:
        "200":
          description: OK

components:

  schemas:

    Usuario:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        email:
          type: string
        tipo_usuario:
          type: string
        id_turma:
          type: integer

    UsuarioCreate:
      type: object
      required: [nome, email, senha, tipo_usuario]
      properties:
        nome:
          type: string
        email:
          type: string
        senha:
          type: string
        tipo_usuario:
          type: string

    ExercicioCreate:
      type: object
      required: [pergunta, resposta_correta, categoria, nivel]
      properties:
        pergunta:
          type: string
        resposta_correta:
          type: string
        categoria:
          type: string
        nivel:
          type: string

    TentativaCreate:
      type: object
      required: [id_aluno, id_exercicio, resposta_usuario]
      properties:
        id_aluno:
          type: integer
        id_exercicio:
          type: integer
        resposta_usuario:
          type: string

    TurmaCreate:
      type: object
      required: [nome, id_professor]
      properties:
        nome:
          type: string
        id_professor:
          type: integer

    EntrarTurma:
      type: object
      required: [id_aluno, codigo]
      properties:
        id_aluno:
          type: integer
        codigo:
          type: string

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
        senha:
          type: string