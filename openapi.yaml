openapi: 3.0.3
info:
  title: Fracta API
  version: 1.0.0
  description: |
    API para o projeto Fracta, voltada ao ensino de frações com cadastro de usuários,
    exercícios, tentativas, turmas e análises pedagógicas com suporte de IA.
  contact:
    name: Equipe Fracta
    email: contato@fracta.com
  license:
    name: MIT
servers:
  - url: http://localhost:5000
    description: Ambiente local
  - url: https://seu-deploy.vercel.app
    description: Ambiente de produção
tags:
  - name: Autenticação
    description: Endpoints de login e acesso
  - name: Usuários
    description: Cadastro, listagem e remoção de usuários
  - name: Exercícios
    description: Gerenciamento de exercícios propostos
  - name: Tentativas
    description: Registro e consulta de respostas dos alunos
  - name: Turmas
    description: Criação de turmas e entrada por código
  - name: Análises e IA
    description: Relatórios pedagógicos e devolutivas geradas com IA
paths:
  /:
    get:
      tags:
        - Autenticação
      summary: Informações básicas da API
      description: Retorna dados básicos da API Fracta.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoApi'
  /login:
    post:
      tags:
        - Autenticação
      summary: Fazer login
      description: Autentica um usuário e retorna um token JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /usuarios:
    get:
      tags:
        - Usuários
      summary: Listar usuários
      description: Retorna todos os usuários cadastrados.
      responses:
        '200':
          description: Lista de usuários retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Usuários
      summary: Cadastrar usuário
      description: Cria um novo usuário no sistema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /usuarios/{id}:
    delete:
      tags:
        - Usuários
      summary: Remover usuário
      description: Remove um usuário com base no identificador informado.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: Identificador do usuário
      responses:
        '200':
          description: Usuário removido com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /exercicios:
    get:
      tags:
        - Exercícios
      summary: Listar exercícios
      description: Retorna todos os exercícios disponíveis.
      responses:
        '200':
          description: Lista de exercícios retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exercicio'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Exercícios
      summary: Cadastrar exercício
      description: Cria um novo exercício para a plataforma.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExercicioInput'
      responses:
        '201':
          description: Exercício cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /tentativas:
    post:
      tags:
        - Tentativas
      summary: Registrar tentativa
      description: Registra a resposta de um aluno para um exercício.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TentativaInput'
      responses:
        '201':
          description: Tentativa registrada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TentativaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tentativas/{id_aluno}:
    get:
      tags:
        - Tentativas
      summary: Listar tentativas do aluno
      description: Retorna todas as tentativas registradas para o aluno informado.
      parameters:
        - in: path
          name: id_aluno
          required: true
          schema:
            type: integer
          description: Identificador do aluno
      responses:
        '200':
          description: Tentativas retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tentativa'
        '500':
          $ref: '#/components/responses/InternalError'
  /turmas:
    get:
      tags:
        - Turmas
      summary: Listar turmas
      description: Retorna todas as turmas cadastradas.
      responses:
        '200':
          description: Turmas retornadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Turma'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
        - Turmas
      summary: Criar turma
      description: Cria uma nova turma e gera um código de acesso.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurmaInput'
      responses:
        '201':
          description: Turma criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TurmaCriadaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /entrar-turma:
    post:
      tags:
        - Turmas
      summary: Entrar em turma
      description: Vincula um aluno a uma turma através do código informado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntrarTurmaInput'
      responses:
        '200':
          description: Aluno entrou na turma com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensagemResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /dashboard/{id_aluno}:
    get:
      tags:
        - Análises e IA
      summary: Dashboard do aluno
      description: Retorna indicadores resumidos de desempenho do aluno.
      parameters:
        - in: path
          name: id_aluno
          required: true
          schema:
            type: integer
          description: Identificador do aluno
      responses:
        '200':
          description: Dashboard gerado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /analise-aluno/{id_aluno}:
    get:
      tags:
        - Análises e IA
      summary: Análise detalhada do aluno
      description: Fornece análise de acertos, erros e feedback por categoria.
      parameters:
        - in: path
          name: id_aluno
          required: true
          schema:
            type: integer
          description: Identificador do aluno
      responses:
        '200':
          description: Análise retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnaliseAlunoResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /devolutiva-ia/{id_aluno}:
    get:
      tags:
        - Análises e IA
      summary: Devolutiva pedagógica com IA
      description: Gera uma devolutiva em linguagem natural para o aluno com base nas tentativas.
      parameters:
        - in: path
          name: id_aluno
          required: true
          schema:
            type: integer
          description: Identificador do aluno
      responses:
        '200':
          description: Devolutiva gerada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolutivaIaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /devolutiva-professor/{id_aluno}:
    get:
      tags:
        - Análises e IA
      summary: Devolutiva para o professor
      description: Gera uma análise pedagógica mais técnica para o professor.
      parameters:
        - in: path
          name: id_aluno
          required: true
          schema:
            type: integer
          description: Identificador do aluno
      responses:
        '200':
          description: Análise para o professor retornada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolutivaProfessorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /devolutiva-turma/{id_turma}:
    get:
      tags:
        - Análises e IA
      summary: Devolutiva geral da turma
      description: Gera uma análise pedagógica consolidada da turma com base nas tentativas dos alunos.
      parameters:
        - in: path
          name: id_turma
          required: true
          schema:
            type: integer
          description: Identificador da turma
      responses:
        '200':
          description: Devolutiva da turma gerada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevolutivaTurmaResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    InfoApi:
      type: object
      properties:
        api:
          type: string
          example: Fracta
        version:
          type: string
          example: 1.0
        author:
          type: string
          example: Elektron
    LoginRequest:
      type: object
      required:
        - email
        - senha
      properties:
        email:
          type: string
          format: email
          example: aluno@fractal.com
        senha:
          type: string
          format: password
          example: 123456
    LoginResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: Login realizado com sucesso
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    Usuario:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          example: ana@email.com
        tipo_usuario:
          type: string
          example: aluno
        id_turma:
          type: integer
          nullable: true
          example: 2
    UsuarioInput:
      type: object
      required:
        - nome
        - email
        - senha
        - tipo_usuario
      properties:
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          example: ana@email.com
        senha:
          type: string
          format: password
          example: 123456
        tipo_usuario:
          type: string
          example: aluno
    Exercicio:
      type: object
      properties:
        id:
          type: integer
          example: 10
        pergunta:
          type: string
          example: Quanto é 1/2 + 1/4?
        resposta_correta:
          type: string
          example: 3/4
        categoria:
          type: string
          example: adição
        nivel:
          type: string
          example: fácil
    ExercicioInput:
      type: object
      required:
        - pergunta
        - resposta_correta
        - categoria
        - nivel
      properties:
        pergunta:
          type: string
          example: Quanto é 1/2 + 1/4?
        resposta_correta:
          type: string
          example: 3/4
        categoria:
          type: string
          example: adição
        nivel:
          type: string
          example: fácil
    Tentativa:
      type: object
      properties:
        id:
          type: integer
          example: 1
        id_aluno:
          type: integer
          example: 7
        id_exercicio:
          type: integer
          example: 10
        resposta_usuario:
          type: string
          example: 1/2
        correta:
          type: boolean
          example: false
        tipo_erro:
          type: string
          nullable: true
          example: Resposta incorreta
    TentativaInput:
      type: object
      required:
        - id_aluno
        - id_exercicio
        - resposta_usuario
      properties:
        id_aluno:
          type: integer
          example: 7
        id_exercicio:
          type: integer
          example: 10
        resposta_usuario:
          type: string
          example: 1/2
    TentativaResponse:
      type: object
      properties:
        correta:
          type: boolean
          example: false
        tipo_erro:
          type: string
          nullable: true
          example: Resposta incorreta
    Turma:
      type: object
      properties:
        id:
          type: integer
          example: 3
        nome:
          type: string
          example: Turma A
        codigo:
          type: string
          example: AB12CD
        id_professor:
          type: integer
          example: 4
    TurmaInput:
      type: object
      required:
        - nome
        - id_professor
      properties:
        nome:
          type: string
          example: Turma A
        id_professor:
          type: integer
          example: 4
    TurmaCriadaResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: Turma criada com sucesso
        codigo:
          type: string
          example: AB12CD
    EntrarTurmaInput:
      type: object
      required:
        - id_aluno
        - codigo
      properties:
        id_aluno:
          type: integer
          example: 7
        codigo:
          type: string
          example: AB12CD
    DashboardResponse:
      type: object
      properties:
        id_aluno:
          type: integer
          example: 7
        total_tentativas:
          type: integer
          example: 12
        acertos:
          type: integer
          example: 8
        erros:
          type: integer
          example: 4
        percentual_acerto:
          type: number
          example: 66.67
    AnaliseAlunoResponse:
      type: object
      properties:
        id_aluno:
          type: integer
          example: 7
        total_tentativas:
          type: integer
          example: 12
        acertos:
          type: integer
          example: 8
        erros:
          type: integer
          example: 4
        percentual_acerto:
          type: number
          example: 66.67
        categorias:
          type: object
          additionalProperties:
            type: object
            properties:
              acertos:
                type: integer
              erros:
                type: integer
        feedback:
          type: string
          example: Bom desempenho, mas ainda existem conteúdos para reforçar.
    DevolutivaIaResponse:
      type: object
      properties:
        id_aluno:
          type: integer
          example: 7
        devolutiva:
          type: string
          example: Você está evoluindo bem e merece continuar praticando.
    DevolutivaProfessorResponse:
      type: object
      properties:
        id_aluno:
          type: integer
          example: 7
        analise_professor:
          type: string
          example: O aluno demonstra evolução, mas ainda precisa reforçar conceitos básicos.
    DevolutivaTurmaResponse:
      type: object
      properties:
        id_turma:
          type: integer
          example: 3
        devolutiva_turma:
          type: string
          example: A turma apresenta um desempenho geral satisfatório.
    MensagemResponse:
      type: object
      properties:
        mensagem:
          type: string
          example: Operação realizada com sucesso
    ErrorResponse:
      type: object
      properties:
        erro:
          type: string
          example: Ocorreu um erro
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Não autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
